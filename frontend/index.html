<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEXC Futures Bot</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      label { display:block; margin:8px 0 4px; }
      input, select { padding:8px; width:280px; }
      button { padding:10px 16px; margin-top:12px; }
      .row { margin-bottom:12px; }
      .card { border:1px solid #ddd; padding:12px; max-width: 640px; }
      pre { background:#f6f8fa; padding:12px; overflow:auto; }
    </style>
  </head>
  <body>
    <h1>MEXC Futures Trading Bot</h1>
    <div class="card">
      <div class="row">
        <label>API Key (leave empty to use server .env)</label>
        <input id="apiKey" type="text" placeholder="Uses server .env if empty" />
      </div>
      <div class="row">
        <label>API Secret (leave empty to use server .env)</label>
        <input id="apiSecret" type="password" placeholder="Uses server .env if empty" />
      </div>
      <div class="row">
        <label>Symbol</label>
        <input id="symbol" type="text" value="BTC_USDT" />
      </div>
      <div class="row">
        <label>Direction</label>
        <select id="direction">
          <option value="auto">Auto</option>
          <option value="long">Long only</option>
          <option value="short">Short only</option>
        </select>
      </div>
      <div class="row">
        <label>Position Size (vol)</label>
        <input id="vol" type="number" step="0.001" value="1" />
      </div>
      <div class="row">
        <label>Leverage</label>
        <input id="leverage" type="number" value="5" />
      </div>
      <div class="row">
        <label>Take Profit (%)</label>
        <input id="tpPct" type="number" step="0.001" value="0.01" />
      </div>
      <div class="row">
        <label>Stop Loss (%)</label>
        <input id="slPct" type="number" step="0.001" value="0.005" />
      </div>
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
    </div>

    <h2>Status</h2>
    <pre id="status"></pre>

    <script>
      let botId = null
      async function start() {
        const payload = {
          apiKey: document.getElementById('apiKey').value.trim(),
          apiSecret: document.getElementById('apiSecret').value.trim(),
          symbol: document.getElementById('symbol').value.trim(),
          direction: document.getElementById('direction').value,
          vol: Number(document.getElementById('vol').value),
          leverage: Number(document.getElementById('leverage').value),
          tpPct: Number(document.getElementById('tpPct').value),
          slPct: Number(document.getElementById('slPct').value)
        }
        const res = await fetch('/api/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
        const data = await res.json()
        botId = data.id
        refresh()
      }
      async function stop() {
        if (!botId) return
        const res = await fetch('/api/stop', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: botId }) })
        await res.json()
        botId = null
        refresh()
      }
      async function refresh() {
        const res = await fetch('/api/status')
        const data = await res.json()
        document.getElementById('status').textContent = JSON.stringify(data, null, 2)
      }
      document.getElementById('startBtn').addEventListener('click', start)
      document.getElementById('stopBtn').addEventListener('click', stop)
      setInterval(refresh, 5000)
      refresh()
    </script>
  </body>
</html>
