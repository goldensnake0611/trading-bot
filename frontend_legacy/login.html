<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Trading Bot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: #1f1f2e;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 320px;
      text-align: center;
      border: 1px solid #333;
    }
    h2 {
      margin: 0 0 24px;
      color: #d46a84;
      font-weight: 600;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: #888;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background: #12121a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #d46a84;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff9a9e 0%, #d46a84 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(212, 106, 132, 0.4);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 106, 132, 0.6);
    }
    button:active {
      transform: translateY(1px);
    }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit">Log In</button>
      <div id="errorMsg" class="error">Invalid credentials</div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        
        if (res.ok) {
          window.location.reload(); // Reloads to trigger server to serve index.html
        } else {
          errorEl.style.display = 'block';
          errorEl.textContent = (await res.json()).error || 'Login failed';
        }
      } catch (err) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
